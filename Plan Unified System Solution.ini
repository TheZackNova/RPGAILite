Plan to Enhance Party and Companion System

    1. Enhanced Context Building for Party Members

    - Modify formatEntityWithContext() to provide comprehensive     
     party member details
    - Add dedicated party context section with detailed member      
    information
    - Include party member status effects, relationships, and       
    recent actions

    2. Improved AI Prompting for Party Dynamics

    - Add party coordination instructions to system prompts
    - Include guidelines for companion personalities and
    individual reactions
    - Enhance combat scenarios to utilize party members
    effectively

    3. Advanced Party Relevance System

    - Create party-specific relevance scoring based on action       
    intent
    - Add companion skill matching for relevant situations
    - Implement party member reaction triggers

    4. Enhanced Party Member Tags and Commands

    - Expand [COMPANION] tag with more attributes (skills,
    relationship, etc.)
    - Add party-specific status effects and interactions
    - Create party leadership and coordination mechanics

    5. UI Improvements for Party Management

    - Enhance party member display with status indicators
    - Add quick access to individual companion information
    - Improve party member interaction options

    6. Context Memory for Party Interactions

    - Track party member dialogue and interactions
    - Remember individual companion preferences and
    personalities
    - Build relationship dynamics over time

    This plan will transform the party system from a basic
    follower list into a dynamic, AI-integrated team management     
     system where companions actively participate in the story      
    and decision-making.